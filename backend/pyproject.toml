[project]
name = "parkinsondiet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.55",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "requests>=2.32",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
